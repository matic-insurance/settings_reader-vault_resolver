name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    env:
      VAULT_ADDR: 'http://127.0.0.1:8200'
      VAULT_TOKEN: 'vault_root_token'
      DATABASE_ADDR: 'database'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: [ '2.7', '3.0', '3.3' ]
#    services:
#      vault:
#        image: hashicorp/vault
#        ports:
#          - "8200:8200"
#        env:
#          VAULT_DEV_ROOT_TOKEN_ID: vault_root_token
#          SKIP_SETCAP: true
#      database:
